version: "3.9"

x-common-env: &common-env
  KAFKA_BROKER: kafka:9092

services:
  # ---------------------------------------------------------------- Kafka
  kafka:
    image: bitnami/kafka:3.7
    container_name: icestream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-kafka.sh"]
    environment:
      <<: *common-env
    volumes:
      - ./infra/bootstrap-kafka.sh:/bootstrap/bootstrap-kafka.sh

  # -------------------------------------------------------------- Storage
  minio:
    image: minio/minio:latest
    container_name: icestream-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/icestream-warehouse || true &&
      echo 'bucket ready: icestream-warehouse'"

  # ---------------------------------------------------------- Iceberg catalog
  catalog-db:
    image: postgres:16-alpine
    container_name: icestream-catalog-db
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------- Producer
  producer:
    build: ./producer
    container_name: icestream-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      RAW_TOPIC: transactions.raw
      EVENTS_PER_SECOND: "200"
      BAD_DATA_RATE: "0.03"
    restart: unless-stopped

  # ------------------------------------------------------- Stream processor
  # NOTE: stream_processor/ will be added in a future sprint.
  # stream-processor:
  #   build:
  #     context: ./stream_processor
  #     dockerfile: Dockerfile
  #   container_name: icestream-stream-processor
  #   environment:
  #     <<: *common-env
  #     RAW_TOPIC: transactions.raw
  #     DLQ_TOPIC: transactions.dlq
  #     ALERT_TOPIC: transactions.alerts
  #     S3_ENDPOINT: http://minio:9000
  #     S3_ACCESS_KEY: minioadmin
  #     S3_SECRET_KEY: minioadmin
  #     ICEBERG_WAREHOUSE: s3://icestream-warehouse/warehouse
  #     CATALOG_URI: postgresql+psycopg2://iceberg:iceberg@catalog-db:5432/iceberg_catalog
  #     ERROR_RATE_TRIP_THRESHOLD: "0.02"
  #     CIRCUIT_COOLDOWN_SECONDS: "20"
  #     BACKEND_EVENTS_URL: http://backend:8000/internal/events
  #   restart: unless-stopped

  # -------------------------------------------------------------- Backend
  backend:
    build: ./backend
    container_name: icestream-backend
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      CATALOG_URI: postgresql+psycopg2://iceberg:iceberg@catalog-db:5432/iceberg_catalog
      ICEBERG_WAREHOUSE: s3://icestream-warehouse/warehouse
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------- Frontend
  frontend:
    build: ./frontend
    container_name: icestream-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  catalog-data:
